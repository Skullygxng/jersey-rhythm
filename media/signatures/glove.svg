<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- Sequinned glove for Rock With You. Drawn for this project, no third party. -->
  <defs>
    <linearGradient id="leather" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#dcd3c2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe693"/>
      <stop offset="0.45" stop-color="#f4bc3c"/>
      <stop offset="1" stop-color="#b57a12"/>
    </linearGradient>
    <radialGradient id="sequin" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff7cf"/>
      <stop offset="0.6" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#e3a91f"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#120a18" flood-opacity="0.5"/>
    </filter>
    <g id="body">
      <path d="M58 176 C40 180 22 168 21 150 C20 133 33 120 49 124 C60 127 66 139 66 151 Z"/>
      <rect x="56" y="118" width="118" height="98" rx="28"/>
      <rect x="56" y="46" width="26" height="112" rx="13"/>
      <rect x="86" y="24" width="28" height="134" rx="14"/>
      <rect x="118" y="30" width="28" height="128" rx="14"/>
      <rect x="150" y="52" width="24" height="106" rx="12"/>
    </g>
  </defs>

  <g filter="url(#shadow)">
    <use href="#body" fill="#241a2d" transform="translate(100 140) scale(1.06) translate(-100 -140)"/>
    <use href="#body" fill="url(#leather)"/>
  </g>

  <rect x="50" y="204" width="130" height="34" rx="12" fill="url(#gold)" stroke="#241a2d" stroke-width="5"/>
  <path d="M82 214 V236 M108 214 V236 M134 214 V236 M160 214 V236" stroke="#8a5a0c" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

  <path d="M86 130 V198 M118 130 V198" stroke="#cdc4b2" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M70 142 C74 129 87 122 99 121" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.8"/>

  <g fill="url(#sequin)" stroke="#b98413" stroke-width="1.2">
    <circle cx="74" cy="160" r="5.5"/>
    <circle cx="99" cy="150" r="5.5"/>
    <circle cx="126" cy="160" r="5.5"/>
    <circle cx="150" cy="150" r="5.5"/>
    <circle cx="86" cy="184" r="5.5"/>
    <circle cx="114" cy="184" r="5.5"/>
    <circle cx="142" cy="184" r="5.5"/>
    <circle cx="60" cy="196" r="4.5"/>
    <circle cx="168" cy="196" r="4.5"/>
    <circle cx="99" cy="74" r="4"/>
    <circle cx="132" cy="78" r="4"/>
  </g>
</svg>
